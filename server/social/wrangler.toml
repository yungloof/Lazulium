name = "lazulium-social"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Crie o banco com `npx wrangler d1 create lazulium-social`, troque o id abaixo pelo que aparecer
# e aplique o schema: `npx wrangler d1 execute lazulium-social --remote --file=schema.sql`
[[d1_databases]]
binding = "DB"
database_name = "lazulium-social"
database_id = "19d70090-513f-4db0-8a51-b1773bed53b4"

# Por local da Cloudflare e aproximado: segura abuso, não é um limite exato
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

# GIF maior e vídeo de fundo ficam na VPS (media-server.mjs). Só vale com o segredo, o mesmo da VPS:
#   npx wrangler secret put MEDIA_SECRET
# Sem o segredo, o servidor segue como antes (GIF até ~1 MB, sem vídeo).
[vars]
MEDIA_STORE_URL = "https://147-15-123-238.sslip.io"

# De hora em hora: repete pedidos de apagar arquivo que a VPS não confirmou
[triggers]
crons = ["23 * * * *"]

# A página do perfil entra no pacote como texto
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
