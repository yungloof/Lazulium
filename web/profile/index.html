<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https:; media-src https://*.steamstatic.com https://147-15-123-238.sslip.io; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Perfil Lazulium</title>
  <style>
    :root {
      --panel: rgba(0, 0, 0, 0.55);
      --line: rgba(255, 255, 255, 0.1);
      --text: #e6edf3;
      --muted: #9fb0c0;
      --faint: #76879a;
      --accent: #6b9bff;
      --gold: #e6c869;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #000;
      color: var(--text);
      font: 14px/1.45 "Segoe UI", "Motiva Sans", Arial, sans-serif;
    }
    img { display: block; max-width: 100%; }
    h1, h2, p, dl, dd, figure { margin: 0; }
    #backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #000; }
    #backdrop img, #backdrop video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    /* Véu leve e por igual, como no app: a arte aparece inteira e parada enquanto a página rola */
    #backdrop::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.15); }
    #page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 28px 24px;
      align-items: start;
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }
    .panel { background: var(--panel); border-radius: 14px; }
    #identity { display: flex; gap: 20px; padding: 20px; min-width: 0; }
    #avatar { position: relative; flex: none; width: 148px; height: 148px; background: #151c30; border-radius: 12px; }
    #avatar > .photo { width: 100%; height: 100%; object-fit: cover; }
    #avatar > .frame { position: absolute; inset: -7%; width: 114%; height: 114%; max-width: none; pointer-events: none; }
    #avatar > .letter { display: flex; height: 100%; align-items: center; justify-content: center; font-size: 56px; color: var(--faint); }
    #identity .text { min-width: 0; padding-top: 4px; }
    h1 { font-size: 28px; font-weight: 400; line-height: 1.2; overflow-wrap: anywhere; }
    #name-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .beta { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(99, 102, 241, 0.2); box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.4); color: #c7d2fe; font-size: 12px; font-weight: 600; }
    #bio { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #side { grid-row: span 2; padding: 20px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    #content { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
    .level { display: flex; align-items: center; gap: 10px; font-size: 20px; }
    .level span { display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; border: 2px solid #9b9b9b; border-radius: 50%; font-size: 14px; }
    .favorite { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; }
    .favorite img { width: 56px; height: 56px; }
    .favorite b { display: block; font-weight: 600; }
    .favorite small { color: var(--muted); font-size: 12px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badges img { width: 48px; height: 48px; object-fit: contain; }
    .count { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
    .count dd { color: var(--muted); font-size: 20px; font-weight: 300; }
    .side-title { margin-bottom: 8px; font-size: 14px; font-weight: 400; }
    .bar-row { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .bar-row .head { display: flex; justify-content: space-between; gap: 8px; }
    .bar { height: 4px; margin-top: 4px; background: rgba(0, 0, 0, 0.6); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .icons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .icons img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #151c30; border-radius: 8px; }
    /* Títulos e legendas ficam soltos sobre a arte: a sombra garante a leitura em fundo claro */
    .section-head, figcaption, footer { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.6); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { font-size: 18px; font-weight: 400; }
    .section-head span { color: var(--muted); }
    figure img { max-height: 420px; object-fit: contain; border-radius: 14px; }
    figcaption { margin-top: 8px; color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: 6px; }
    .game { padding: 12px; }
    .game .top { display: flex; align-items: flex-start; gap: 12px; }
    .game .capsule { flex: none; width: 184px; aspect-ratio: 184 / 69; object-fit: cover; background: #151c30; border-radius: 10px; }
    .game .title { flex: 1; min-width: 0; color: #fff; overflow-wrap: anywhere; }
    .game .time { flex: none; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .game .ach { display: flex; align-items: center; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .game .ach > div:first-child { flex: 1; min-width: 0; }
    .game .ach .row { display: flex; flex: none; gap: 4px; }
    .game .ach .row img { width: 32px; height: 32px; }
    .covers { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 12px; }
    .cover img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #151c30; border-radius: 10px; }
    .cover b { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cover small { color: var(--muted); font-size: 11px; }
    .rare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .rare { display: flex; align-items: center; gap: 12px; padding: 8px; min-width: 0; }
    .rare img { flex: none; width: 44px; height: 44px; }
    .rare div { flex: 1; min-width: 0; }
    .rare b, .rare small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
    .rare small { color: var(--faint); font-size: 11px; }
    .rare em { flex: none; font-style: normal; font-size: 12px; color: var(--gold); }
    #notice { grid-column: 1 / -1; padding: 12px 16px; font-size: 13px; }
    #notice code { color: var(--accent); }
    footer { grid-column: 1 / -1; color: var(--faint); font-size: 12px; text-align: center; }
    /* Abas e avaliações: cada jogo avaliado vira uma publicação, com a resenha que abre e fecha */
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab { padding: 7px 16px; border: 0; border-radius: 999px; background: var(--panel); color: var(--muted); font: inherit; cursor: pointer; }
    .tab:hover { color: #fff; }
    .tab[aria-selected="true"] { background: rgba(107, 155, 255, 0.28); color: #fff; }
    .tab small { margin-left: 6px; opacity: 0.7; }
    .posts { padding: 4px 18px; }
    .post { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 0 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .post:last-child { border-bottom: 0; }
    .post .c { width: 96px; aspect-ratio: 3 / 4; object-fit: cover; background: #151c30; border-radius: 6px; align-self: start; }
    .post .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .post .head b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; font-size: 15px; }
    .post .head span { flex: none; color: var(--faint); }
    .post .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 4px; color: var(--muted); font-size: 13px; }
    .stars { display: inline-flex; gap: 1px; }
    .star { position: relative; display: inline-block; width: 14px; height: 14px; font-size: 14px; line-height: 14px; color: rgba(255, 255, 255, 0.22); }
    .star::before, .star i::before { content: "\2605"; }
    .star i { position: absolute; top: 0; bottom: 0; left: 0; overflow: hidden; color: var(--gold); }
    .dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; }
    .post .body { margin-top: 10px; color: #cfd8e3; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .post .body.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .post .more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; }
    .post .more:hover { text-decoration: underline; }
    .empty { padding: 18px; color: var(--muted); }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      #page { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 40px; }
      #side { grid-row: auto; order: 2; }
      #content { order: 3; }
      footer { order: 4; }
      #identity { flex-direction: column; align-items: flex-start; }
      .game .top { flex-wrap: wrap; }
      .game .capsule { width: 100%; }
      .game .time { text-align: left; }
      .game .ach { flex-wrap: wrap; }
      .covers { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .rare-grid { grid-template-columns: minmax(0, 1fr); }
      .post { grid-template-columns: 72px minmax(0, 1fr); }
      .post .c { width: 72px; }
    }
  </style>
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <div id="page">
    <p id="notice" class="panel" hidden>
      Mostrando dados de exemplo. No Lazulium, use <code>Perfil → Publicar na web</code>, ou coloque <code>lazulium-perfil.json</code> nesta pasta.
    </p>
    <header id="identity" class="panel">
      <div id="avatar"></div>
      <div class="text">
        <div id="name-row"><h1 id="name">Carregando...</h1><span id="beta" class="beta" title="Ajudou a testar o Lazulium desde as primeiras versões" hidden>Beta tester</span></div>
        <p id="bio" hidden></p>
      </div>
    </header>
    <aside id="side" class="panel"></aside>
    <main id="content"></main>
    <footer id="footer"></footer>
  </div>

  <script>
    const LEVEL_COLORS = ['#9b9b9b', '#c02942', '#d95b43', '#fecc23', '#467a3c', '#4e8ddb', '#7652c9', '#c252c9', '#542437', '#997c52'];
    const PLATFORM_LABEL = {
      steam: 'Steam',
      epic: 'Epic Games',
      gog: 'GOG',
      battlenet: 'Battle.net',
      ea: 'EA App',
      ubisoft: 'Ubisoft Connect',
      riot: 'Riot Games',
      xbox: 'Xbox',
      emulator: 'Emuladores',
      standalone: 'Outros PC'
    };

    const hours = (seconds) => {
      if (!seconds || seconds <= 0) return '0 h';
      const h = seconds / 3600;
      if (h < 1) return Math.max(1, Math.round(seconds / 60)) + ' min';
      return h >= 100 ? Math.round(h).toLocaleString('pt-BR') + ' h' : h.toFixed(1).replace('.', ',') + ' h';
    };
    const shortDate = (iso) => {
      const date = iso ? new Date(iso) : null;
      return date && !isNaN(date) ? date.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '') : '';
    };
    const STATUS_LABEL = { backlog: 'Quero jogar', playing: 'Jogando', endless: 'Contínuo', paused: 'Pausado', finished: 'Zerado', completed: '100%', dropped: 'Abandonado' };
    const STATUS_COLOR = { backlog: '#cbd5e1', playing: '#34d399', endless: '#22d3ee', paused: '#94a3b8', finished: '#818cf8', completed: '#fbbf24', dropped: '#f87171' };
    const longDate = (day) => {
      const date = day ? new Date(day + 'T12:00:00') : null;
      return date && !isNaN(date) ? date.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '') : '';
    };
    const https = (url) => (typeof url === 'string' && /^https:\/\//i.test(url) ? url : '');

    // Tudo do JSON entra por textContent e atributos: nada é interpretado como HTML
    function el(tag, props, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (value === undefined || value === null || value === '') continue;
        if (key === 'class') node.className = value;
        else if (key === 'style') node.style.cssText = value;
        else node.setAttribute(key, value);
      }
      for (const child of children.flat()) {
        if (child !== null && child !== undefined && child !== false) node.append(child);
      }
      return node;
    }
    const image = (url, alt, className) => {
      const src = https(url);
      if (!src) return null;
      const node = el('img', { src, alt: alt || '', class: className, loading: 'lazy', referrerpolicy: 'no-referrer' });
      node.addEventListener('error', () => node.remove());
      return node;
    };
    const section = (title, extra, ...children) =>
      el('section', null, el('div', { class: 'section-head' }, el('h2', null, title), extra ? el('span', null, extra) : null), children);

    function setBackdrop(background) {
      const box = document.getElementById('backdrop');
      box.replaceChildren();
      const poster = https(background && background.imageUrl);
      const video = https(background && background.videoUrl);
      if (poster) box.append(el('img', { src: poster, alt: '', referrerpolicy: 'no-referrer' }));
      if (video && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const node = el('video', { src: video, poster, preload: 'auto' });
        node.muted = true;
        node.defaultMuted = true;
        node.autoplay = true;
        node.loop = true;
        node.playsInline = true;
        node.addEventListener('error', () => node.remove());
        box.append(node);
        node.play().catch(() => {});
        document.addEventListener('visibilitychange', () => (document.hidden ? node.pause() : node.play().catch(() => {})));
      }
    }

    function gameRow(game) {
      const total = Number(game.achievementsTotal) || 0;
      const unlocked = Number(game.achievementsUnlocked) || 0;
      return el('div', { class: 'game panel' },
        el('div', { class: 'top' },
          image(game.heroUrl || game.coverUrl, '', 'capsule') || el('div', { class: 'capsule' }),
          el('div', { class: 'title' }, game.title),
          el('div', { class: 'time' },
            el('div', null, hours(game.playtimeSeconds) + ' registradas'),
            game.lastPlayedAt ? el('div', null, 'jogado por último em ' + shortDate(game.lastPlayedAt)) : null,
            game.recentSeconds > 0 ? el('div', null, hours(game.recentSeconds) + ' nas últimas 2 semanas') : null)),
        total > 0
          ? el('div', { class: 'ach' },
              el('div', null, unlocked + ' / ' + total + ' conquistas',
                el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.min(100, Math.round((unlocked / total) * 100)) + '%' }))),
              el('div', { class: 'row' }, (game.recentAchievementIcons || []).map((a) => image(a.iconUrl, a.name))))
          : null);
    }

    function stars(value) {
      const box = el('span', { class: 'stars', title: String(value).replace('.', ',') + ' de 5' });
      for (let n = 1; n <= 5; n++) {
        const fill = Math.max(0, Math.min(1, value - (n - 1)));
        box.append(el('span', { class: 'star' }, fill > 0 ? el('i', { style: 'width:' + fill * 100 + '%' }) : null));
      }
      return box;
    }

    function post(r) {
      const text = typeof r.review === 'string' ? r.review.trim() : '';
      const long = text.length > 360 || text.split('\n').length > 5;
      const body = text ? el('p', { class: 'body' + (long ? ' clamp' : '') }, text) : null;
      const more = long ? el('button', { type: 'button', class: 'more' }, 'Ler mais') : null;
      if (more) more.addEventListener('click', () => { const closed = body.classList.toggle('clamp'); more.textContent = closed ? 'Ler mais' : 'Ler menos'; });
      const status = STATUS_LABEL[r.status];
      return el('article', { class: 'post' },
        image(r.coverUrl, r.title, 'c') || el('div', { class: 'c' }),
        el('div', { style: 'min-width:0' },
          el('div', { class: 'head' }, el('b', { title: r.title }, r.title), r.date ? el('span', null, '· ' + longDate(r.date)) : null),
          el('div', { class: 'meta' },
            r.rating > 0 ? stars(r.rating) : null,
            r.playtimeSeconds > 0 ? el('span', null, hours(r.playtimeSeconds)) : null,
            status ? el('span', null, el('i', { class: 'dot', style: 'background:' + STATUS_COLOR[r.status] }), status) : null,
            el('span', null, 'em ' + (PLATFORM_LABEL[r.platform] || r.platform))),
          body, more));
    }

    function renderSide(profile, web) {
      const side = document.getElementById('side');
      side.replaceChildren();
      const t = profile.totals || {};
      const top = el('div');
      if (typeof profile.steamLevel === 'number') {
        const ring = el('span', { style: 'border-color:' + LEVEL_COLORS[Math.floor(profile.steamLevel / 10) % 10] }, String(profile.steamLevel));
        top.append(el('div', { class: 'level' }, 'Nível', ring));
      }
      if (web.favoriteBadge && https(web.favoriteBadge.iconUrl)) {
        top.append(el('div', { class: 'favorite' }, image(web.favoriteBadge.iconUrl), el('div', null, el('b', null, web.favoriteBadge.name), el('small', null, web.favoriteBadge.detail))));
      }
      if (top.children.length) side.append(top);
      if (Array.isArray(web.badges) && web.badges.length) {
        side.append(el('div', { class: 'badges' }, web.badges.map((b) => { const i = image(b.iconUrl, b.name); if (i) i.title = b.name; return i; })));
      }
      const count = (label, value) => el('div', { class: 'count' }, el('dt', null, label), el('dd', null, String(value)));
      side.append(el('dl', null,
        count('Jogos jogados', (t.playedGames || 0).toLocaleString('pt-BR')),
        count('Horas jogadas', hours(t.playtimeSeconds)),
        count('Conquistas', (t.achievementsUnlocked || 0).toLocaleString('pt-BR')),
        t.perfectGames > 0 ? count('Jogos 100%', t.perfectGames) : null));

      const platforms = (profile.byPlatform || []).filter((p) => p.playtimeSeconds > 0);
      if (platforms.length) {
        const max = Math.max(1, ...platforms.map((p) => p.playtimeSeconds));
        side.append(el('div', null, el('h2', { class: 'side-title' }, 'Plataformas'), platforms.map((p) =>
          el('div', { class: 'bar-row' },
            el('div', { class: 'head' }, el('span', null, PLATFORM_LABEL[p.platform] || p.platform), el('span', null, hours(p.playtimeSeconds))),
            el('div', { class: 'bar' }, el('i', { style: 'width:' + (p.playtimeSeconds / max) * 100 + '%' }))))));
      }
      const recent = (profile.recentAchievements || []).filter((a) => https(a.iconUrl)).slice(0, 10);
      if (recent.length) {
        side.append(el('div', null, el('h2', { class: 'side-title' }, 'Últimas conquistas'),
          el('div', { class: 'icons' }, recent.map((a) => { const i = image(a.iconUrl, a.name); if (i) i.title = a.name + ' — ' + a.gameTitle; return i; }))));
      }
    }

    // Aba atual da página: a visão geral ou os jogos avaliados
    const view = { tab: 'overview', onlyReviews: false };

    function renderRatings(profile) {
      const all = profile.ratings || [];
      const written = all.filter((r) => typeof r.review === 'string' && r.review.trim());
      const shown = view.onlyReviews ? written : all;
      const pill = (label, count, active, onClick) => {
        const node = el('button', { type: 'button', class: 'tab', 'aria-selected': String(active) }, label, el('small', null, String(count)));
        node.addEventListener('click', onClick);
        return node;
      };
      const filters = el('div', { class: 'tabs' },
        pill('Todas as avaliações', all.length, !view.onlyReviews, () => { view.onlyReviews = false; renderContent(profile, profile.web || {}); }),
        pill('Só com resenha', written.length, view.onlyReviews, () => { view.onlyReviews = true; renderContent(profile, profile.web || {}); }));
      return [filters, shown.length
        ? el('div', { class: 'panel posts' }, shown.map(post))
        : el('p', { class: 'panel empty' }, 'Nenhuma resenha escrita ainda.')];
    }

    function renderContent(profile, web) {
      const content = document.getElementById('content');
      content.replaceChildren();
      if ((profile.ratings || []).length) {
        const tab = (id, label, count) => {
          const node = el('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(view.tab === id) }, label, count ? el('small', null, String(count)) : null);
          node.addEventListener('click', () => { view.tab = id; renderContent(profile, web); });
          return node;
        };
        content.append(el('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Partes do perfil' }, tab('overview', 'Visão geral'), tab('ratings', 'Avaliações', profile.ratings.length)));
        if (view.tab === 'ratings') {
          content.append(...renderRatings(profile));
          return;
        }
      }
      const parts = {
        artwork: () => (web.showcaseArt && https(web.showcaseArt.imageUrl)
          ? el('figure', null, image(web.showcaseArt.imageUrl, web.showcaseArt.title), web.showcaseArt.title ? el('figcaption', null, web.showcaseArt.title) : null)
          : null),
        activity: () => ((profile.recentGames || []).length
          ? section('Atividade recente', profile.recentPlaytimeSeconds ? hours(profile.recentPlaytimeSeconds) + ' nas últimas 2 semanas' : '',
              el('div', { class: 'stack' }, profile.recentGames.slice(0, 5).map(gameRow)))
          : null),
        featured: () => ((profile.featuredGames || []).length
          ? section('Jogos em destaque', '', el('div', { class: 'covers panel' }, profile.featuredGames.map((g) =>
              el('div', { class: 'cover' }, image(g.coverUrl, g.title) || el('img', { alt: '' }), el('b', { title: g.title }, g.title), el('small', null, hours(g.playtimeSeconds))))))
          : null),
        achievements: () => {
          const chosen = (profile.featuredAchievements || []).length ? profile.featuredAchievements : profile.rarestAchievements || [];
          if (!chosen.length) return null;
          return section('Vitrine de conquistas', (profile.featuredAchievements || []).length ? '' : 'as mais raras',
            el('div', { class: 'rare-grid' }, chosen.map((a) => el('div', { class: 'rare panel' }, image(a.iconUrl),
              el('div', null, el('b', { title: a.name }, a.name), el('small', null, a.gameTitle)),
              typeof a.globalPercent === 'number' ? el('em', null, a.globalPercent.toFixed(1).replace('.', ',') + '%') : null))));
        },
        mostPlayed: () => ((profile.mostPlayed || []).length
          ? section('Mais jogados', '', el('div', { class: 'stack' }, profile.mostPlayed.map(gameRow)))
          : null)
      };
      const order = (profile.custom && profile.custom.sections) || Object.keys(parts);
      for (const id of order) {
        const part = parts[id] ? parts[id]() : null;
        if (part) content.append(part);
      }
    }

    function renderProfile(profile) {
      const web = profile.web || {};
      const name = profile.displayName || 'Jogador';
      document.title = name + ' · Perfil Lazulium';
      document.getElementById('name').textContent = name;
      document.getElementById('beta').hidden = profile.betaTester !== true;

      const avatar = document.getElementById('avatar');
      avatar.replaceChildren(image(profile.avatarUrl, name, 'photo') || el('div', { class: 'letter' }, name.charAt(0).toUpperCase()));
      const frame = image(web.avatarFrameUrl, '', 'frame');
      if (frame) avatar.append(frame);

      const bio = document.getElementById('bio');
      bio.textContent = web.bio || (profile.custom && profile.custom.bio) || '';
      bio.hidden = !bio.textContent;

      setBackdrop(web.background || (profile.recentGames && profile.recentGames[0] && { imageUrl: profile.recentGames[0].heroUrl }));
      renderSide(profile, web);
      renderContent(profile, web);
      document.getElementById('footer').textContent = 'Feito com o Lazulium' + (profile.generatedAt ? ' · atualizado em ' + shortDate(profile.generatedAt) : '');
    }

    async function loadJson(path) {
      const res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    (async () => {
      // Perfil de amigo no Lazulium: o servidor da conta entrega a página com o perfil já embutido
      if (window.LAZULIUM_PROFILE) {
        renderProfile(window.LAZULIUM_PROFILE);
        return;
      }
      try {
        renderProfile(await loadJson('./lazulium-perfil.json'));
        return;
      } catch {
        // Sem perfil publicado: tenta o exemplo, que só existe no código do projeto
      }
      try {
        renderProfile(await loadJson('./lazulium-perfil.exemplo.json'));
        document.getElementById('notice').hidden = false;
      } catch {
        document.getElementById('name').textContent = 'Perfil indisponível';
        document.getElementById('bio').textContent = 'Publique de novo pelo Lazulium: Perfil → Publicar na web.';
        document.getElementById('bio').hidden = false;
      }
    })();
  </script>
</body>
</html>
